[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-os-core"
version = "0.5.0"
description = "Control Plane determinista y federado de AI OS"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "AI OS Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# La página del monitor, sus iconos (Magnific) y el fondo viajan con el paquete
ai_os_core = ["monitor/*.html", "monitor/*.jpg", "monitor/iconos/*.svg", "infrastructure/db/migrations/sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Cada módulo de test carga el aislamiento (tests/__init__.py) antes de importar nada de Core
"tests/*/test_*.py" = ["E401", "E402", "E702"]
